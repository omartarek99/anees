openapi: 3.0.3
info:
  title: Anees API
  version: "1.0"
  description: >-
    REST API of Anees (Express + SQLite). Generated from backend/src/routes. Authentication is a session cookie
    (anees_session, httpOnly) set by POST /api/auth/login (or /signup, /google); every state-changing request
    must also send the header "X-Requested-With: anees" (CSRF guard). Errors are JSON {"error": "<sentence>"}.
    Role rules per endpoint are listed in each description and in x-roles.
servers:
  - url: https://anees-qa.site
    description: Production (frontend proxies /api to the backend)
  - url: http://localhost:4000
    description: Local backend
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: anees_session
    csrfHeader:
      type: apiKey
      in: header
      name: X-Requested-With
      description: Must be the value "anees" on POST / PUT / PATCH / DELETE.
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
tags:
  - name: "Auth"
  - name: "Users"
  - name: "Reels"
  - name: "Adventure map"
  - name: "Worksheets"
  - name: "Leaderboard"
  - name: "Friends"
  - name: "Quarry game"
  - name: "Teacher lessons"
  - name: "Admin"
  - name: "Analytics"
  - name: "Certificates"
  - name: "Guide"
  - name: "Challenges"
  - name: "Violations"
  - name: "Health"
paths:
  "/api/admin/accounts/inactive":
    get:
      tags: ["Admin"]
      summary: "Accounts nobody has used for a while (students and teachers that are still switched on), the longest-quiet fir"
      description: "Accounts nobody has used for a while (students and teachers that are still switched on), the longest-quiet first. Access: Signed-in admin."
      operationId: "getapi_admin_accounts_inactive"
      x-roles: "Signed-in admin."
      security:
        - sessionCookie: []
      responses:
        '200':
          description: OK
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not signed in
        '403':
          description: Signed in with a role that may not use this
  "/api/admin/accounts/search":
