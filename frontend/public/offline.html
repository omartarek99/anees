<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#8A1538" />
    <meta name="robots" content="noindex" />
    <title>Anees</title>
    <style>
      html, body { height: 100%; margin: 0; }
      body {
        display: flex; align-items: center; justify-content: center; text-align: center;
        padding: env(safe-area-inset-top) 24px env(safe-area-inset-bottom);
        background: #fbf6f1; color: #2b2b2b;
        font-family: system-ui, -apple-system, 'Segoe UI', Tahoma, sans-serif;
      }
      main { max-width: 340px; }
      img { width: 96px; height: 96px; }
      h1 { font-size: 22px; margin: 16px 0 6px; color: #8a1538; }
      p { margin: 0 0 6px; line-height: 1.6; color: #555; }
      button {
        margin-top: 18px; padding: 12px 28px; border: 0; border-radius: 14px;
        background: #8a1538; color: #fff; font-size: 16px; font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>لا يوجد اتصال بالإنترنت</h1>
      <p>تحقّق من اتصالك ثم حاول مرة أخرى.</p>
      <p lang="en" dir="ltr">You're offline. Check your connection and try again.</p>
      <button type="button" onclick="location.reload()">إعادة المحاولة · Retry</button>
    </main>
  </body>
</html>
